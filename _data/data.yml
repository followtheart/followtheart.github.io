career-profile:
  title: Profile
  summary: |
    I work at the intersection of **edge AI, high-performance computing, and C++ systems engineering**. Since starting my software development career in 2013, I have built experience across computer vision, medical imaging, quantum communication software, and production client applications.

    At **Tianyi Digital Life Technology Co., Ltd.**, I develop and deploy on-device vision algorithms, maintain a Digital Village client serving **hundreds of thousands of users**, and contribute to AI agent systems. My engineering work spans algorithm implementation, heterogeneous computing optimization, and software architecture and delivery.

    My research interests center on **model compression, distributed inference, and robustness at the edge**. I have co-authored three papers published at **ASP-DAC**, in **IEEE TCAD**, and in **Integration**, studying distributed CNN and Transformer inference. I hold a B.Sc. in Computer Science and Technology from Nanjing Agricultural University.

