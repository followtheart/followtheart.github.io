career-profile:
  title: 个人简介
  summary: |
    专注于**端侧人工智能、高性能计算与 C++ 系统研发**。自 2013 年从事软件开发，积累了计算机视觉、医疗影像、量子通信软件与规模化客户端的研发经验，持续将算法能力转化为可部署、可维护的工程系统。

    现任**天翼数字生活科技有限公司端侧 AI 工程师**，负责端侧视觉算法研发与部署，维护服务**数十万用户**的「数字乡村」客户端，并参与智能体系统设计与开发。工程实践覆盖算法实现、异构计算性能优化，以及软件架构、模块化与持续交付。

    研究兴趣集中于**模型压缩、边缘分布式推理与鲁棒性**，围绕 CNN 与 Transformer 的分布式推理开展学术合作，以共同作者身份在 **ASP-DAC、IEEE TCAD、Integration** 发表三篇论文。本科毕业于南京农业大学计算机科学与技术专业。

