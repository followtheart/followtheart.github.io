experiences:
  - role: 端侧 AI 工程师
    time: 2025.04 - 至今
    company: 天翼数字生活科技有限公司
    details: |
      - 负责端侧视觉算法的研发、部署与维护，覆盖图像分类、超分辨率、图像上色与文搜图等场景。
      - 负责「数字乡村」客户端的维护与迭代开发，支撑数十万用户使用，持续保障线上稳定性与功能演进。
      - 参与智能体系统的设计与开发，推动大模型能力在端侧及业务场景中的工程化落地。
  - role: 高级 C++ 开发工程师
    time: 2024.06 - 2025.01
    company: 深圳华声医疗技术股份有限公司 · Wisonic
    details: |
      - 参与彩色多普勒心脏超声产品研发，负责 OpenCL、OpenGL 与 CPU 混合异构计算的图像处理性能调优，涵盖 OpenCL Kernel 与 CUDA 算子优化。
      - 主导基于 Conan 的超声软件模块化与版本管理，提升大型软件系统的可维护性与交付效率。
  - role: C++ 开发工程师
    time: 2022.08 - 2024.06
    company: 国腾（广州）量子计算科技有限公司
    details: |
      - 负责广佛肇量子通信干线项目全套软件研发，覆盖 QKD、QKM、QKMS 与上位机系统。
      - 负责密钥管理软件的架构设计与实现，基于 C++/Qt、gRPC 与 HP-Socket 实现 Windows、Linux 跨平台通信，并通过 SPI/UART 对接底层硬件。
  - role: 配置管理工程师（SCM）
    time: 2022.01 - 2022.08
    company: 南京中科创达软件科技有限公司 · ThunderSoft
    details: |
      - 搭建并维护 Jenkins 持续集成系统，编写日常构建与验证构建脚本，负责项目集成编译。
      - 搭建 OpenGrok、Gerrit 代码管理系统，维护代码提交门禁并接入 Coverity 安全扫描，保障研发流程中的代码质量。
  - role: 软件研发工程师
    time: 2013.05 - 2022.01
    company: 南京西湾信息科技有限公司
    details: |
      - 负责产品技术原型设计、技术难题攻关与系统接口设计，协调团队间的技术接口与集成。
      - 主导人脸识别系统（Gabor + PCA）、基于消息队列的高并发期货交易引擎等原型研发，并开展比特币源码分析，涉及 Qt、Boost、LevelDB 与 OpenSSL。

